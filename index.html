<!doctype html>
<html lang="zh-Hant">
<head>

  <meta name="theme-color" content="#0a0c13">
  <title>夜市擂台 2D</title>
  <style>
    html, body { margin: 0; overflow: hidden; overscroll-behavior: none; background: #0a0c13; }
    #frame {
      position: fixed;
      inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    .notice {
      position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 1rem;
      background: #0a0c13; color: #fff2d8; text-align: center; font: 600 1.1rem system-ui, sans-serif;
    }
    [hidden] { display: none; }
  </style>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
  <main id="frame">
    <canvas id="canvas" tabindex="0" aria-label="夜市擂台 2D 遊戲畫面"></canvas>
    <p id="rotate" class="notice" hidden>請將手機轉為橫向</p>
    <p id="status" class="notice" role="status">正在載入夜市擂台…</p>
  </main>
  <script src="index.js"></script>
  <script>
    const canvas = document.querySelector('#canvas');
    const status = document.querySelector('#status');
    const rotate = document.querySelector('#rotate');
    const coarse = matchMedia('(pointer: coarse)');
    const portraitMedia = matchMedia('(orientation: portrait)');
    const viewport = { touch: coarse.matches, portrait: false, interruption: 0 };
    window.duelViewport = viewport;

    function updateOrientation() {
      const portrait = coarse.matches && portraitMedia.matches;
      if (viewport.portrait !== portrait) viewport.interruption++;
      viewport.touch = coarse.matches;
      viewport.portrait = portrait;
      rotate.hidden = !portrait;
      canvas.inert = portrait;
    }

    function sizeCanvas() {
      const scale = window.devicePixelRatio || 1;
      const width = Math.round(canvas.clientWidth * scale);
      const height = Math.round(canvas.clientHeight * scale);
      if (canvas.width !== width) canvas.width = width;
      if (canvas.height !== height) canvas.height = height;
    }

    coarse.addEventListener('change', updateOrientation);
    portraitMedia.addEventListener('change', updateOrientation);
    window.addEventListener('blur', () => viewport.interruption++);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) viewport.interruption++;
    });
    new ResizeObserver(sizeCanvas).observe(document.querySelector('#frame'));
    updateOrientation();
    sizeCanvas();

    const engine = new Engine({ ...{"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":7554156,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4}, canvas, canvasResizePolicy: 0 });
    engine.startGame().then(() => { status.hidden = true; }).catch(error => {
      status.textContent = '遊戲載入失敗，請重新整理。';
      console.error(error);
    });
  </script>
</body>
</html>
